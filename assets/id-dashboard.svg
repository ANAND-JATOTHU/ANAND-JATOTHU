<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420">
  <defs>
    <linearGradient id="idbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="idborder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
    <linearGradient id="cardgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="cardtop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.07"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="idportrait">
      <rect x="0" y="0" width="110" height="110" rx="10"/>
    </clipPath>
    <filter id="dropshadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#247bff" flood-opacity="0.35"/>
    </filter>
    <pattern id="barcode" x="0" y="0" width="6" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="3" height="40" fill="#e8edf5"/>
      <rect x="4" y="0" width="1" height="40" fill="#e8edf5" opacity="0.4"/>
    </pattern>
    <pattern id="iddots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#247bff" fill-opacity="0.07"/>
    </pattern>
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </defs>

  <!-- main bg -->
  <rect width="860" height="420" fill="#070b16" rx="16"/>
  <rect width="860" height="420" fill="url(#iddots)" rx="16"/>
  <rect width="860" height="420" fill="url(#idbg)" rx="16"/>
  <rect x="1" y="1" width="858" height="418" rx="15" fill="none" stroke="url(#idborder)" stroke-width="1.5" opacity="0.5"/>

  <!-- left: stats text -->
  <text x="36" y="50" font-size="11" font-family="'JetBrains Mono',monospace" fill="#247bff" letter-spacing="3">DEVELOPER ID</text>
  <rect x="36" y="56" width="60" height="2" fill="#247bff" rx="1"/>

  <text x="36" y="96" font-size="13" fill="#8892a4">Role</text>
  <text x="36" y="114" font-size="16" font-weight="700" fill="#e8edf5">Full-Stack Developer · AI Engineer</text>

  <text x="36" y="148" font-size="13" fill="#8892a4">University</text>
  <text x="36" y="166" font-size="15" fill="#e8edf5">TKREC — B.Tech IT (2023–2027)</text>

  <text x="36" y="200" font-size="13" fill="#8892a4">Location</text>
  <text x="36" y="218" font-size="15" fill="#e8edf5">Hyderabad, India</text>

  <text x="36" y="252" font-size="13" fill="#8892a4">Specialisation</text>
  <text x="36" y="270" font-size="15" fill="#e8edf5">Next.js · Supabase · Python · AI/ML</text>

  <text x="36" y="304" font-size="13" fill="#8892a4">Status</text>
  <rect x="36" y="312" width="12" height="12" rx="6" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="54" y="323" font-size="14" fill="#22c55e" font-weight="600">Available for Internship</text>

  <text x="36" y="360" font-size="13" fill="#8892a4">Certifications</text>
  <text x="36" y="378" font-size="11.5" fill="#e8edf5">AWS Developer Associate (Infosys)</text>
  <text x="36" y="394" font-size="11.5" fill="#e8edf5">ServiceNow CIS-DF · NPTEL ML · Ethical Hacking</text>

  <!-- ── LANYARD CARD (pendulum) ── -->
  <g transform="translate(590,0)">
    <!-- pendulum swing -->
    <animateTransform attributeName="transform" type="translate" values="590,0;590,0" dur="0.1s" begin="0s" fill="both"/>
  </g>
  <g id="lanyard" transform-origin="720 10">
    <!-- drop-in settle animation -->
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,-300;0,20;0,-8;0,3;0,0" dur="1.2s" begin="0s" keyTimes="0;0.55;0.75;0.88;1" fill="both"/>
    <!-- gentle pendulum swing -->
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="0 720 10;1.7 720 10;0 720 10;-1.7 720 10;0 720 10" dur="4s" begin="1.5s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"/>

    <!-- lanyard cord -->
    <line x1="720" y1="10" x2="720" y2="68" stroke="#247bff" stroke-width="3" opacity="0.6"/>
    <line x1="700" y1="10" x2="700" y2="68" stroke="#247bff" stroke-width="1.5" opacity="0.3"/>
    <line x1="740" y1="10" x2="740" y2="68" stroke="#247bff" stroke-width="1.5" opacity="0.3"/>

    <!-- metal clasp -->
    <rect x="706" y="60" width="28" height="16" rx="4" fill="#374151" stroke="#8892a4" stroke-width="1"/>
    <rect x="711" y="64" width="18" height="8" rx="2" fill="#1f2937"/>
    <circle cx="720" cy="68" r="3" fill="#8892a4"/>

    <!-- card body -->
    <g filter="url(#dropshadow)">
      <rect x="600" y="72" width="240" height="330" rx="16" fill="url(#cardgrad)" stroke="#1a2540" stroke-width="1.5"/>
      <!-- card top color band -->
      <rect x="600" y="72" width="240" height="48" rx="16" fill="url(#cardtop)"/>
      <rect x="600" y="104" width="240" height="16" fill="url(#cardtop)"/>
      <!-- foil sweep -->
      <rect x="600" y="72" width="240" height="330" rx="16" fill="url(#foil)">
        <animate attributeName="x" values="440;840;440" dur="6s" begin="1.5s" repeatCount="indefinite"/>
      </rect>

      <!-- LOGO area -->
      <text x="720" y="103" font-size="11" font-family="'JetBrains Mono',monospace" fill="white" text-anchor="middle" letter-spacing="2" font-weight="700">DEV · ID CARD</text>

      <!-- portrait in card -->
      <image href="https://raw.githubusercontent.com/ANAND-JATOTHU/ANAND-JATOTHU/main/assets/id.png" x="655" y="130" width="130" height="130" clip-path="url(#idportrait)" preserveAspectRatio="xMidYMid slice"/>
      <rect x="655" y="130" width="130" height="130" rx="10" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>

      <!-- name on card -->
      <text x="720" y="278" font-size="16" font-weight="900" fill="#e8edf5" text-anchor="middle">ANAND JATOTHU</text>
      <text x="720" y="296" font-size="11" fill="#8892a4" text-anchor="middle">Full-Stack · AI/ML · Cloud</text>

      <!-- divider -->
      <line x1="620" y1="306" x2="820" y2="306" stroke="#1a2540" stroke-width="1"/>

      <!-- barcode -->
      <rect x="630" y="314" width="180" height="40" fill="url(#barcode)" opacity="0.85"/>
      <text x="720" y="372" font-size="9" fill="#8892a4" text-anchor="middle" font-family="'JetBrains Mono',monospace">ANAND-JATOTHU · github.com</text>

      <!-- corner chip -->
      <rect x="790" y="82" width="38" height="18" rx="5" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="0.5" opacity="0.6"/>
      <text x="809" y="94" font-size="9" fill="white" text-anchor="middle" font-weight="700">2026</text>
    </g>
  </g>
</svg>