name: Draw Koi & Contribution Snake

on:
  schedule:
    - cron: '5 0 * * *' # Runs daily just after midnight UTC
  workflow_dispatch:
    inputs:
      body:
        description: 'Koi Body Variant'
        required: true
        default: 'white'
        type: choice
        options:
          - white
          - gold
          - asagi
          - black
          - platinum
          - tea
  push:
    branches:
      - main

jobs:
  koi-and-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: ANAND-JATOTHU
          body: ${{ inputs.body || 'white' }}

      - name: Generate Koi Pond Variants
        run: python scripts/generate_pond.py

      - name: Generate Contribution Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ANAND-JATOTHU
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit generated assets if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/ assets/github-contribution-grid-snake*.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore(profile): update activity koi & contribution snake [skip ci]"
            git push
          fi
